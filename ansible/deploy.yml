---
- name: Déployer Mon Agenda sur Kubernetes
  hosts: local
  connection: local
  gather_facts: false

  vars:
    kube_context: kind-agenda-devsecops   # adapte avec le résultat de kubectl config current-context
    k8s_namespace: default
    k8s_dir: "{{ playbook_dir }}/../k8s"

  tasks:
    - name: Chercher le secret existant
      kubernetes.core.k8s_info:
        context: "{{ kube_context }}"
        kind: Secret
        name: agenda-secrets
        namespace: "{{ k8s_namespace }}"
      register: existing_secret

    - name: Créer le secret avec une clé aléatoire s'il n'existe pas
      kubernetes.core.k8s:
        context: "{{ kube_context }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: agenda-secrets
            namespace: "{{ k8s_namespace }}"
          type: Opaque
          stringData:
            MONGO_URI: "mongodb://mongo-service:27017/agenda"
            SECRET_KEY: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=48') }}"
      when: existing_secret.resources | length == 0
      no_log: true

    - name: Appliquer les manifests (MongoDB, app, services, NetworkPolicy)
      kubernetes.core.k8s:
        context: "{{ kube_context }}"
        state: present
        namespace: "{{ k8s_namespace }}"
        src: "{{ k8s_dir }}/deployment.yaml"
        wait: true
        wait_timeout: 180

    - name: Vérifier que l'application répond
      ansible.builtin.uri:
        url: http://localhost:3000/health
        status_code: 200
      register: health
      retries: 10
      delay: 5
      until: health.status == 200