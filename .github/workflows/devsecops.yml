name: Pipeline DevSecOps - Mon Agenda

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-checks:
    name: Analyse de sécurité (Secrets, Code & Conteneur)
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code et de tout l'historique Git
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Recherche de mots de passe / clés API dans l'historique Git
      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      # 3. Analyse statique du code JavaScript/NodeJS (SAST)
      - name: Analyse SAST du code source (Semgrep)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep \
          semgrep scan --config=p/javascript --config=p/nodejs --config=p/owasp-top-ten --error /src

      # 4. Construction de l'image Docker de l'application
      - name: Build de l'image Docker
        run: docker build -t mon-agenda:ci .

      # 5. Scan des vulnérabilités (CVE) dans les paquets npm et l'OS Docker
      - name: Scan de vulnérabilités Docker & Dépendances (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'mon-agenda:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'